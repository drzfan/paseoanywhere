name: check

# JS 层快速检查：push（main / feat/**）与 PR 触发，目标 5 分钟内。
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck + lint + export:web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
          cache: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Export web
        run: bun run export:web

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
